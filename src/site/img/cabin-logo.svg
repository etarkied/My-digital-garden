<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Etar's Note Cabin">
  <defs>
    <linearGradient id="cabinBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="cabinGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cabinClip">
      <rect x="2" y="2" width="60" height="60" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#cabinBadge)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#cabinGlow)"/>

  <g clip-path="url(#cabinClip)" fill="#ffffff" fill-opacity="0.82">
    <!-- far pines -->
    <path d="M13.5 39.5 19 31l5.5 8.5H13.5Z" fill-opacity="0.42"/>
    <path d="M40 42.5 45 35l5 7.5H40Z" fill-opacity="0.34"/>
    <!-- near pine -->
    <path d="M11.5 45 19 34.5l7.5 10.5H11.5Z" fill-opacity="0.5"/>
    <rect x="18" y="45" width="2" height="4" fill-opacity="0.5"/>

    <!-- chimney -->
    <rect x="41" y="20.6" width="3.2" height="6" rx="0.6"/>
    <!-- roof + eaves -->
    <path d="M32 16 50 33H14L32 16Z"/>
    <rect x="12.4" y="32.2" width="39.2" height="2.6" rx="1.3"/>

    <!-- cabin body -->
    <rect x="17.6" y="34.8" width="28.8" height="15.9" rx="1.8" fill-opacity="0.92"/>

    <!-- door cut out of the lighter face -->
    <path d="M31 37.9c2.4 0 4.3 1.9 4.3 4.3V50h-8.6v-7.8c0-2.4 1.9-4.3 4.3-4.3Z" fill="#1f6feb"/>

    <!-- windows: the light in the cabin -->
    <rect x="20.4" y="39" width="6.4" height="5.6" rx="1.2" fill="#ffd33d"/>
    <rect x="37.2" y="39" width="6.4" height="5.6" rx="1.2" fill="#ffd33d"/>

    <!-- ground line -->
    <rect x="8" y="50.4" width="48" height="1.8" rx="0.9" fill-opacity="0.35"/>
  </g>
</svg>
