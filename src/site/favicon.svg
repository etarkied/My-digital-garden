<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Etar's Note Cabin">
  <defs>
    <linearGradient id="cabinBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4C98A"/>
      <stop offset="0.55" stop-color="#E9A96B"/>
      <stop offset="1" stop-color="#D9835B"/>
    </linearGradient>
    <clipPath id="cabinClip">
      <rect x="2" y="2" width="60" height="60" rx="17" ry="17"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" ry="17" fill="url(#cabinBadge)"/>

  <g clip-path="url(#cabinClip)">
    <!-- far pines -->
    <path d="M13.5 38.5 19 30l5.5 8.5H13.5Z" fill="rgba(41,26,17,0.24)"/>
    <path d="M40 41.5 45 34l5 7.5H40Z" fill="rgba(41,26,17,0.20)"/>
    <!-- near pine -->
    <path d="M12 44 19 34l7 10H12Z" fill="rgba(41,26,17,0.30)"/>
    <rect x="18" y="44" width="2" height="4" fill="rgba(41,26,17,0.30)"/>

    <!-- chimney -->
    <rect x="41" y="20.6" width="3.2" height="6" rx="0.6" fill="#3B2B24"/>
    <!-- cabin roof -->
    <path d="M32 16.5 49.5 33h-35L32 16.5Z" fill="#3B2B24"/>
    <!-- eaves -->
    <rect x="12.6" y="32.4" width="38.8" height="2.4" rx="1.2" fill="#2E211D"/>

    <!-- cabin body -->
    <rect x="17.5" y="34.8" width="29" height="15.7" rx="1.6" fill="#FFF6E5"/>

    <!-- door -->
    <path d="M31 38.2c2.4 0 4.3 1.9 4.3 4.3V50h-8.6v-7.5c0-2.4 1.9-4.3 4.3-4.3Z" fill="#B5654A"/>
    <circle cx="34" cy="45.2" r="0.9" fill="#F4C98A"/>

    <!-- lit windows -->
    <rect x="20.6" y="39.2" width="6.2" height="5.4" rx="1" fill="#F2B23E"/>
    <rect x="37.2" y="39.2" width="6.2" height="5.4" rx="1" fill="#F2B23E"/>

    <!-- ground -->
    <path d="M9 50.6h46v7.4H9z" fill="rgba(41,26,17,0.22)"/>
  </g>
</svg>
